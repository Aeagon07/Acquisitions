name: Lint and Format

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Run Prettier check
        id: format
        continue-on-error: true
        run: npm run format:check

      - name: Summarize results
        if: always()
        shell: bash
        run: |
          {
            echo "## Lint and format results"
            echo
            echo "- ESLint: ${{ steps.lint.outcome }}"
            echo "- Prettier: ${{ steps.format.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on lint or format issues
        if: always()
        shell: bash
        run: |
          failed=0

          if [ "${{ steps.lint.outcome }}" = "failure" ]; then
            echo "::error title=ESLint failed::Lint issues were found. Run 'npm run lint:fix' locally to apply automatic fixes where possible."
            failed=1
          fi

          if [ "${{ steps.format.outcome }}" = "failure" ]; then
            echo "::error title=Prettier check failed::Formatting issues were found. Run 'npm run format' locally to format the codebase."
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
